[project]
name = "opencomplai-core"
version = "0.9.0"
description = "Opencomplai core engine for AI compliance: the EU AI Act, and NIST AI RMF derived from the same evidence"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Opencomplai", email = "hello@opencomplai.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "cryptography>=48.0.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://opencomplai.com"
Documentation = "https://docs.opencomplai.com"
Source = "https://github.com/Opencomplai/opencomplai"
Issues = "https://github.com/Opencomplai/opencomplai/issues"
Changelog = "https://github.com/Opencomplai/opencomplai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
reports = [
    "fpdf2>=2.7",
]
inspect-bridge = [
    "inspect-ai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src"]
