[project]
name = "opencomplai-cli"
version = "0.6.0"
description = "Opencomplai command-line interface for EU AI Act compliance assessment"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Opencomplai", email = "hello@opencomplai.com" }]
requires-python = ">=3.11"
dependencies = [
    "opencomplai-core[reports]>=0.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.urls]
Homepage = "https://opencomplai.com"
Documentation = "https://docs.opencomplai.com"

[project.scripts]
opencomplai = "opencomplai_cli.main:app"
# The CI connectors' own docstrings and docs/src/guides/ci-integration.md
# instruct users to run these commands; without the entry points a
# documented `pip install opencomplai` + `run: opencomplai-gha-connector`
# job dies with "command not found" before any exit-code logic executes.
opencomplai-gha-connector = "opencomplai_cli.connectors.github_actions:main"
opencomplai-gitlab-connector = "opencomplai_cli.connectors.gitlab_ci:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    # Only used by test_publish.py's structural schema-validation test (an
    # end-to-end proof that the real repo-root compliance-artifact.json,
    # once mapped, validates against dashboard-saas's vendored
    # first_scan_status.schema.json) -- never imported by runtime code.
    # Same package/version floor dashboard-saas/services/ingest-api's
    # pyproject.toml already declares.
    "jsonschema>=4.21",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opencomplai_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/opencomplai_cli/data/checker-local.html" = "opencomplai_cli/data/checker-local.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
