[project]
name = "opencomplai"
version = "0.9.1"
description = "Opencomplai Python SDK for AI compliance: the EU AI Act, and NIST AI RMF derived from the same evidence"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Opencomplai", email = "hello@opencomplai.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "opencomplai-core>=0.9.1",
    "opencomplai-cli>=0.9.1",
]

[project.urls]
Homepage = "https://opencomplai.com"
Documentation = "https://docs.opencomplai.com"
Source = "https://github.com/Opencomplai/opencomplai"
Issues = "https://github.com/Opencomplai/opencomplai/issues"
Changelog = "https://github.com/Opencomplai/opencomplai/blob/main/CHANGELOG.md"

[project.scripts]
# uv tool / pipx expose only the named package's own scripts, not its dependencies'.
opencomplai = "opencomplai_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
reports = [
    "opencomplai-core[reports]>=0.9.1",
]
inspect-bridge = [
    "opencomplai-core[inspect-bridge]>=0.9.1",
]
serve = [
    "opencomplai-cli[serve]>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src"]
