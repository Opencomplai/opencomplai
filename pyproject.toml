[tool.uv.workspace]
members = ["packages/*", "services/risk-engine", "services/evidence-vault", "services/doc-generator", "services/egress-proxy"]

[tool.uv.sources]
opencomplai = { workspace = true }
opencomplai-cli = { workspace = true }
opencomplai-core = { workspace = true }
opencomplai-risk-engine = { workspace = true }
opencomplai-evidence-vault = { workspace = true }
opencomplai-doc-generator = { workspace = true }
opencomplai-egress-proxy = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument and fastapi.Depends/Query/etc. are called in argument
# defaults by design — that is the framework idiom, not a B008 mutable-default bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "typer.Option",
    "typer.Argument",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tools", "api"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.uv]
# Security: pin minimum safe versions for transitive deps flagged by pip-audit
constraint-dependencies = [
    "starlette>=1.3.1",
    "mako>=1.3.12",
    "idna>=3.15",
    "cryptography>=50.0.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "anyio>=4.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    # Pinned to the exact version CI resolves so local, pre-commit and CI agree; Dependabot bumps it.
    "ruff==0.15.12",
    # packages/cli/tests/test_publish.py's structural schema-validation
    # test needs this to actually run (rather than soft-skip) under
    # `uv sync --all-packages` -- CI's test-cli job never passes
    # --extra dev, so packages/cli's own [project.optional-dependencies]
    # dev group is not what supplies this workspace-wide dev venv; this
    # root dependency-group is. Same floor packages/cli/pyproject.toml
    # and dashboard-saas/services/ingest-api/pyproject.toml both declare.
    "jsonschema>=4.21",
]
