version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    # TypeScript 7 drops the JS compiler API that typescript-eslint 8.x loads,
    # so eslint fails at startup; Vite majors are taken deliberately.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
    groups:
      gateway-api:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/docs/checker-widget"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      checker-widget:
        patterns:
          - "*"
