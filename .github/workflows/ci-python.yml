name: CI — Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  # Only the security job runs on the scheduled event; workflow_dispatch
  # lets it be triggered on demand too (e.g. to re-check after an
  # advisory is published outside the weekly cadence).
  workflow_dispatch:

jobs:
  lint:
    name: Lint / Python
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-core:
    name: Test / core
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - run: uv run pytest packages/core -v --tb=short
      # The Vercel mount-prefix tests are stdlib-only; every job invokes
      # pytest with explicit paths, so testpaths alone never runs them.
      - run: uv run pytest api/_shared -v --tb=short

  test-cli:
    name: Test / cli
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - run: uv run pytest packages/cli -v --tb=short

  test-sdk:
    name: Test / sdk-python
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - run: uv run pytest packages/sdk-python -v --tb=short

  test-ai:
    name: Test / ai
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - run: uv run pytest packages/ai -v --tb=short

  test-services:
    name: Test / Python services
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opencomplai
          POSTGRES_PASSWORD: opencomplai_test
          POSTGRES_DB: opencomplai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # evidence-vault's Postgres RLS suite (test_rls_postgres.py) skips
      # itself when this is unset; asyncpg driver, matches conftest's
      # postgresql+asyncpg:// -> postgresql:// rewrite for the sync
      # alembic engine.
      EVIDENCE_VAULT_POSTGRES_URL: postgresql+asyncpg://opencomplai:opencomplai_test@localhost:5432/opencomplai_test
      # migrations/env.py's _get_database_url() requires this for the
      # alembic upgrade/downgrade the RLS fixture runs (sync driver).
      DATABASE_URL: postgresql://opencomplai:opencomplai_test@localhost:5432/opencomplai_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - run: uv run pytest services/risk-engine services/evidence-vault services/doc-generator services/egress-proxy tools/verify-ledger -v --tb=short

  cli-check:
    name: CLI / compliance check (local engine)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - name: Run compliance init
        run: |
          uv run opencomplai init \
            --system-id "ci-sample-system" \
            --intended-purpose "customer support chatbot" \
            --output /tmp/ci-manifest.json
      - name: Run compliance check (local, expect exit 0 for minimal risk)
        run: |
          uv run opencomplai check \
            --manifest /tmp/ci-manifest.json \
            --commit-ref "${{ github.sha }}" \
            --scan-mode ci \
            --output json
      - name: Verify artifact was written
        run: test -f compliance-artifact.json
      - name: Upload status artifact
        uses: actions/upload-artifact@v7
        with:
          name: compliance-artifact-${{ github.sha }}
          path: compliance-artifact.json
          retention-days: 90
      - name: Run compliance check (trap path, expect exit 4)
        run: |
          set +e
          uv run opencomplai check \
            --manifest packages/cli/tests/fixtures/trap/trap-manifest.json \
            --commit-ref "${{ github.sha }}" \
            --scan-mode ci \
            --output json \
            --change-context model_retrain
          EXIT_CODE=$?
          echo "Trap check exited with code $EXIT_CODE (expected 4 -- TRAP_DETECTED)"
          if [ "$EXIT_CODE" -ne 4 ]; then
            echo "FAIL: EU_AIA_ART25_MODIFICATION_TRAP did not fire as expected (got exit $EXIT_CODE, want 4)"
            exit 1
          fi

  egress-dlp:
    name: DLP / egress-proxy allowlist
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - name: Run DLP test suite (REQ-ARC-001)
        run: uv run pytest services/egress-proxy/tests/test_dlp.py -v --tb=short
      - name: Verify zero forbidden fields invariant
        run: |
          uv run python <<'PY'
          from opencomplai_egress_proxy.allowlist import ALLOWED_FIELDS, validate_payload
          bad = [('raw_inference_payload', 'secret'), ('model_weights', 'bin')]
          for k, v in bad:
              assert not validate_payload({k: v})[0], f"forbidden field leaked: {k}"
          print('DLP invariant OK — forbidden fields correctly blocked')
          PY

  security:
    name: Security scan / Python (ISO 27001 A.8.8 / SOC 2 CC7.1 / NIST ID.RA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Build checker-local.html
        run: |
          cd docs/checker-widget
          npm ci
          node build.mjs
          test -f ../../packages/cli/src/opencomplai_cli/data/checker-local.html
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-packages
      - name: Install pip-audit
        run: uv pip install pip-audit
      # transformers is held at 4.57.x by optimum-onnx (<4.58,>=4.36) via
      # the packages/ai [onnx] extra; fixes for the advisories below are
      # all 5.x. Tracked in #54; drop these flags once optimum-onnx
      # supports transformers 5.
      - name: pip-audit (fail on any finding)
        run: >-
          uv run pip-audit
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln CVE-2026-9856

  ai-package-gate:
    name: AI/LLM package gate (EU AI Act Art. 3/50 / ISO 27001 A.5.7)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write AI package gate script
        run: |
          cat > "$RUNNER_TEMP/ai_package_gate.sh" << 'GATE_SCRIPT'
          #!/usr/bin/env bash
          # ai_package_gate.sh <repo-root>
          #
          # Scans pyproject.toml, package.json, and requirements*.txt files under
          # <repo-root> for AI/LLM package names that are not explicitly approved in
          # docs/security/ai-inventory.md's "Approved AI Dependencies" table.
          #
          # Exit 0: no unapproved packages found.
          # Exit 1: at least one unapproved package found.
          set -euo pipefail

          ROOT="${1:-.}"
          INVENTORY="$ROOT/docs/security/ai-inventory.md"

          FORBIDDEN="openai anthropic transformers torch tensorflow langchain llm sentence-transformers diffusers accelerate onnxruntime huggingface-hub llama-cpp-python"

          # Extract ONLY the "Approved AI Dependencies" table section (stops at the
          # next level-2 heading, or EOF) so a mere mention elsewhere in the doc (the
          # "Found" table, prose, References) never counts as approval.
          approved_section() {
            if [ -f "$INVENTORY" ]; then
              awk '
                /^## Approved AI Dependencies/ { capture=1; next }
                /^## / { if (capture) exit }
                capture { print }
              ' "$INVENTORY"
            fi
          }

          APPROVED="$(approved_section)"

          is_approved() {
            local pkg="$1"
            printf '%s\n' "$APPROVED" | grep -Fq "\`$pkg\`"
          }

          # Matches a quoted package token (TOML/JSON) followed immediately by: an
          # extras bracket, a version-specifier/separator character, whitespace, or
          # the closing quote itself -- never a mere name-prefix (e.g. "openai" must
          # not match a real "openai-agents" package).
          quoted_tail_regex() {
            local pkg="$1"
            local qc='["'"'"']'
            echo "${qc}${pkg}(\\[|[><=~!;, ]|${qc}|\$)"
          }

          # Matches a bare package token at the start of a requirements.txt line
          # (no surrounding quotes there), followed by the same set of terminators.
          bare_tail_regex() {
            local pkg="$1"
            echo "^[[:space:]]*${pkg}(\\[|[><=~!; ]|\$)"
          }

          FOUND=0

          report() {
            local pkg="$1" file="$2" matches="$3"
            if is_approved "$pkg"; then
              echo "OK: $pkg found in $file but listed in the Approved AI Dependencies table"
            else
              echo "FAIL: Unapproved AI/LLM package found: $pkg ($file)"
              echo "$matches"
              FOUND=1
            fi
          }

          scan_quoted() {
            local file="$1"
            for pkg in $FORBIDDEN; do
              local regex matches
              regex="$(quoted_tail_regex "$pkg")"
              matches="$(grep -nE "$regex" "$file" 2>/dev/null || true)"
              if [ -n "$matches" ]; then
                report "$pkg" "$file" "$matches"
              fi
            done
          }

          scan_bare() {
            local file="$1"
            for pkg in $FORBIDDEN; do
              local regex matches
              regex="$(bare_tail_regex "$pkg")"
              matches="$(grep -nE "$regex" "$file" 2>/dev/null || true)"
              if [ -n "$matches" ]; then
                report "$pkg" "$file" "$matches"
              fi
            done
          }

          # Fixture/example paths deliberately contain "bad" AI packages as sample
          # data for opencomplai's own EU-AI-Act scanning engine to detect -- they
          # describe a *scanned target*, not a manifest opencomplai itself ships, so
          # they are out of scope for this gate (same reasoning excludes vendored and
          # build-output trees).
          EXCLUDE_ARGS=(
            -not -path "*/node_modules/*"
            -not -path "*/.venv/*"
            -not -path "*/dist/*"
            -not -path "*/tests/*"
            -not -path "*/examples/*"
            -not -path "*/fixtures/*"
          )

          while IFS= read -r -d '' f; do
            scan_quoted "$f"
          done < <(find "$ROOT" \( -name "pyproject.toml" -o -name "package.json" \) \
            "${EXCLUDE_ARGS[@]}" -print0)

          while IFS= read -r -d '' f; do
            scan_bare "$f"
          done < <(find "$ROOT" -name "requirements*.txt" "${EXCLUDE_ARGS[@]}" -print0)

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "To approve a new AI dependency, add it to the Approved AI Dependencies"
            echo "table in $INVENTORY and get CISO/maintainer sign-off."
            exit 1
          fi

          echo "AI package gate passed -- no unapproved AI/LLM dependencies found."
          exit 0
          GATE_SCRIPT
          chmod +x "$RUNNER_TEMP/ai_package_gate.sh"

      - name: Self-test -- gate must detect a known-bad AI/LLM dependency
        run: |
          SANDBOX="$RUNNER_TEMP/ai-gate-selftest"
          rm -rf "$SANDBOX"
          mkdir -p "$SANDBOX/docs/security"
          cp docs/security/ai-inventory.md "$SANDBOX/docs/security/ai-inventory.md"
          cat > "$SANDBOX/pyproject.toml" << 'BAD_PYPROJECT'
          [project]
          name = "self-test-fixture"
          dependencies = [
              "torch>=2.0",
          ]
          BAD_PYPROJECT
          set +e
          "$RUNNER_TEMP/ai_package_gate.sh" "$SANDBOX"
          SELF_TEST_EXIT=$?
          set -e
          if [ "$SELF_TEST_EXIT" -ne 1 ]; then
            echo "FAIL: gate self-test did not detect the injected unapproved 'torch' dependency (exit $SELF_TEST_EXIT, want 1) -- the gate has gone vacuous"
            exit 1
          fi
          echo "Gate self-test OK: unapproved dependency correctly detected (exit 1)"

      - name: Scan repo for unapproved AI/LLM packages
        run: $RUNNER_TEMP/ai_package_gate.sh .
