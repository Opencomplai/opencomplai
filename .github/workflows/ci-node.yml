name: CI — Node

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway-api-lint:
    name: Lint / gateway-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter opencomplai-gateway-api run lint

  gateway-api-typecheck:
    name: Typecheck / gateway-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # `build` emits to dist/ via tsc; --noEmit runs the same type check
      # without writing build output, per tsconfig.json's compilerOptions.
      - run: pnpm --filter opencomplai-gateway-api exec tsc --noEmit
      # The Vercel adapter (api/gateway/*) sits outside the package's
      # tsconfig rootDir and was previously never type-checked by any job.
      - name: Typecheck Vercel adapter
        run: pnpm --filter opencomplai-gateway-api exec tsc --noEmit -p ../../api/gateway/tsconfig.json

  gateway-api-test:
    name: Test / gateway-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter opencomplai-gateway-api run test

  gateway-api-audit:
    name: Audit / gateway-api dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Non-blocking: `pnpm audit --prod` against the pinned lockfile
      # currently reports 15 findings (3 moderate / 12 high), all
      # transitive -- through the optional OpenTelemetry auto-instrumentation
      # bundle (@opentelemetry/auto-instrumentations-node) and
      # @fastify/swagger-ui's @fastify/static/glob chain. None are reachable
      # via gateway-api's own code paths. Flip continue-on-error to false
      # once the lockfile is updated to versions that resolve these (tracked
      # as a follow-up; see PR/issue notes) so this gate is not silently
      # green forever.
      - name: pnpm audit --prod
        run: pnpm audit --prod
        continue-on-error: true

  checker-widget:
    name: Build+Test / checker-widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/checker-widget/package-lock.json
      - name: Install
        run: |
          cd docs/checker-widget
          npm ci
      - name: Build checker-widget bundle and local HTML
        run: |
          cd docs/checker-widget
          node build.mjs
          node build-local-html.mjs
      - name: Verify committed checker-local.html is up to date
        run: |
          git diff --exit-code -- packages/cli/src/opencomplai_cli/data/checker-local.html || {
            echo "FAIL: packages/cli/src/opencomplai_cli/data/checker-local.html is stale."
            echo "Run 'node build.mjs && node build-local-html.mjs' in docs/checker-widget and commit the result."
            exit 1
          }
      - name: Run golden test suite
        run: |
          cd docs/checker-widget
          npm test

  vercel-adapter-test:
    name: Test / api adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      # handler.test.ts imports the real gateway app (extensionless internal
      # imports), which Node's native type stripping can't resolve — run the
      # stdlib node:test files through tsx (already a gateway devDependency).
      - run: pnpm install --frozen-lockfile
      - name: Run Vercel adapter tests (URL rewrite + handler)
        run: pnpm --filter opencomplai-gateway-api exec tsx --test ../../api/gateway/_lib/rewriteUrl.test.ts ../../api/gateway/handler.test.ts
