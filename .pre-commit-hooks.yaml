# The opencomplai-cli pin must equal the release version: stamped at release time, enforced by packages/cli/tests/test_precommit_hooks_pin.py.
- id: opencomplai-quick-scan
  name: Opencomplai quick scan
  description: >-
    Zero-config discovery scan for AI/ML capability signals in the repo. Never gates
    the commit and never requires a system-manifest.json — informational only. Use
    `opencomplai-check` instead once you have a manifest and want a real CI gate.
  entry: opencomplai scan --quick --repo-root .
  language: python
  additional_dependencies: ["opencomplai-cli==0.9.0"]
  pass_filenames: false
  always_run: true

- id: opencomplai-check
  name: Opencomplai compliance check
  description: >-
    Full compliance gate against a declared system-manifest.json: the EU AI Act,
    plus any other framework opencomplai.yaml gates. Requires `opencomplai init`
    to have been run first. Fails the commit on CONTROL_FAIL,
    VALIDATION_FAIL, POLICY_BLOCK, or TRAP_DETECTED (see exit codes in README).
  entry: opencomplai check
  language: python
  additional_dependencies: ["opencomplai-cli==0.9.0"]
  pass_filenames: false
  always_run: true
